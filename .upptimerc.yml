# Yoorie Status - Upptime configuration (https://upptime.js.org)
owner: yoorie
repo: status
user-agent: yoorie-status

# All hosts verified live with curl on 2026-10-17 before adding.
# Endpoints that redirect to a login page are checked at the final login URL so the check gets a direct 200.
sites:
  - name: Yoorie Website
    url: https://yoorie.com
    icon: https://yoorie.com/brand/yoorie-icon-email.png
    maxResponseTime: 5000
  - name: Yoorie CRM & Client Portal
    url: https://crm.yoorie.com/authentication/login
    slug: crm
    icon: https://yoorie.com/brand/yoorie-icon-email.png
    maxResponseTime: 5000
  - name: Yoorie App
    url: https://app.yoorie.com/admin/login
    slug: app
    icon: https://yoorie.com/brand/yoorie-icon-email.png
    maxResponseTime: 5000
  - name: Yoorie Booking
    url: https://book.yoorie.com
    slug: booking
    icon: https://yoorie.com/brand/yoorie-icon-email.png
    maxResponseTime: 5000
  - name: Yoorie Analytics
    url: https://analytics.yoorie.com/matomo.js
    slug: analytics
    icon: https://yoorie.com/brand/yoorie-icon-email.png
    maxResponseTime: 5000
  - name: Yoorie Social
    url: https://social.yoorie.com/up
    slug: social
    icon: https://yoorie.com/brand/yoorie-icon-email.png
    maxResponseTime: 5000

status-website:
  cname: status.yoorie.com
  name: Yoorie Status
  logoUrl: https://yoorie.com/brand/yoorie-logo-720.png
  favicon: https://yoorie.com/brand/yoorie-icon-email.png
  themeUrl: /yoorie-theme.css
  introTitle: "**Yoorie Status** - live uptime and response times for Yoorie services."
  introMessage: "Checked every 5 minutes by GitHub Actions. Questions? Email [info@yoorie.com](mailto:info@yoorie.com)."
  navbar:
    - title: Status
      href: /
    - title: yoorie.com
      href: https://yoorie.com
  robotsText: "User-agent: *\nAllow: /"

i18n:
  footer: "© Yoorie. Status page powered by open-source Upptime."
